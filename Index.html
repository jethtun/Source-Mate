<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2563eb">
  <title>Sourcing Mate Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  
  <script>
    let state = {
      visits: JSON.parse(localStorage.getItem('visits') || '[]'),
      items: JSON.parse(localStorage.getItem('items') || '[]'),
      settings: JSON.parse(localStorage.getItem('settings') || '{"defaultAgentCommission":5,"exchangeRate":4.8,"agentName":"","agentEmail":"","agentWechat":"","agentPhone":"","categories":["Automotive & Garden","Baby & Kids","Electronics & Accessories","Health & Wellness","Home Decor & Textiles","Household & Cleaning","Kitchen & Dining","Personal Care & Beauty","Pet Supplies","Seasonal & Party Supplies","Stationery & Office","Storage & Organization","Tools & Hardware"]}'),
      currentVisit: null,
      currentEditItem: null,
      negotiationPhoto: null,
      negotiationNotes: '',
      view: 'home',
      homeTab: 'recent',
      selectedCategory: 'All',
      formData: { photo: null, factoryPrice: '', moq: '1', description: '', modelNumber: '', color: '', material: '', category: '' },
      supplierForm: { name: '', wechat: '', email: '', address: '', cardImage: null, agentCommission: '', boothNumber: '', tradeFair: '', contact: '', phone: '' }
    };

    function saveState() {
      localStorage.setItem('visits', JSON.stringify(state.visits));
      localStorage.setItem('items', JSON.stringify(state.items));
      localStorage.setItem('settings', JSON.stringify(state.settings));
    }

    function convertToAUD(rmb) {
      return (parseFloat(rmb) / state.settings.exchangeRate).toFixed(2);
    }

    function calculateLandedCost(factoryPrice) {
      const commission = state.currentVisit?.agentCommission || state.settings.defaultAgentCommission;
      return parseFloat(factoryPrice) * (1 + commission / 100);
    }

    function getStorageSize() {
      const size = (new Blob([JSON.stringify(state.visits)]).size + 
                   new Blob([JSON.stringify(state.items)]).size) / 1024;
      return size.toFixed(1);
    }

    function compressImage(file, maxWidth, quality) {
      return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > maxWidth) {
              h = h * maxWidth / w;
              w = maxWidth;
            }
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function handleCardPhoto(e) {
      const file = e.target.files[0];
      if (file) {
        state.supplierForm.cardImage = await compressImage(file, 1200, 0.8);
        render();
      }
    }

    async function handleProductPhoto(e) {
      const file = e.target.files[0];
      if (file) {
        state.formData.photo = await compressImage(file, 800, 0.7);
        render();
      }
    }

    async function handleNegotiationPhoto(e) {
      const file = e.target.files[0];
      if (file) {
        state.negotiationPhoto = await compressImage(file, 800, 0.7);
        render();
      }
    }

    function saveSupplier(addItems) {
      const name = document.getElementById('supplierName').value;
      const boothNumber = document.getElementById('boothNumber').value;
      
      if (!name) return alert('Please enter company name');
      if (!boothNumber) return alert('Please enter booth number');
      
      const visit = {
        id: Date.now(),
        name: name,
        boothNumber: boothNumber,
        tradeFair: document.getElementById('tradeFair').value,
        contact: document.getElementById('supplierContact').value,
        phone: document.getElementById('supplierPhone').value,
        wechat: document.getElementById('supplierWechat').value,
        email: document.getElementById('supplierEmail').value,
        address: document.getElementById('supplierAddress').value,
        cardImage: state.supplierForm.cardImage,
        agentCommission: parseFloat(document.getElementById('supplierCommission').value) || state.settings.defaultAgentCommission,
        timestamp: new Date().toISOString()
      };
      
      state.visits.push(visit);
      state.currentVisit = visit;
      state.supplierForm = { name: '', wechat: '', email: '', address: '', cardImage: null, agentCommission: '', boothNumber: '', tradeFair: '', contact: '', phone: '' };
      saveState();
      
      if (addItems) {
        state.view = 'addProduct';
      } else {
        state.view = 'home';
      }
      render();
    }

    function updateProductPrices() {
      state.formData.factoryPrice = document.getElementById('factoryPrice').value;
      state.formData.moq = document.getElementById('moq').value;
      
      const factoryPrice = parseFloat(state.formData.factoryPrice) || 0;
      const moq = parseInt(state.formData.moq) || 1;
      
      if (factoryPrice > 0) {
        const audPrice = convertToAUD(factoryPrice);
        const landedCost = calculateLandedCost(factoryPrice);
        const priceDisplay = document.getElementById('priceDisplay');
        if (priceDisplay) {
          priceDisplay.innerHTML = `
            <div class="flex justify-between text-sm">
              <span>Retail Price (AUD):</span>
              <span class="font-semibold">A\\$${audPrice}</span>
            </div>
            <div class="flex justify-between text-sm mt-1">
              <span>Landed Cost (with ${state.currentVisit?.agentCommission || state.settings.defaultAgentCommission}% commission):</span>
              <span class="font-semibold">¥${landedCost.toFixed(2)}</span>
            </div>
          `;
        }
      }
      
      if (moq > 1 && factoryPrice > 0) {
        const totalRMB = factoryPrice * moq;
        const totalAUD = convertToAUD(totalRMB);
        const moqDisplay = document.getElementById('moqDisplay');
        if (moqDisplay) {
          moqDisplay.innerHTML = `
            <div class="text-sm text-gray-600 mb-1">Total for ${moq} units:</div>
            <div class="flex justify-between items-center">
              <div>
                <div class="text-lg font-bold text-green-700">¥${totalRMB.toFixed(2)}</div>
                <div class="text-sm text-gray-600">RMB</div>
              </div>
              <div class="text-right">
                <div class="text-lg font-bold text-green-700">A\\$${totalAUD}</div>
                <div class="text-sm text-gray-600">AUD</div>
              </div>
            </div>
          `;
        }
      }
    }

    function saveProduct(addNext) {
      const factoryPrice = document.getElementById('factoryPrice').value;
      
      if (!state.formData.photo || !factoryPrice) {
        return alert('Please fill in photo and factory price');
      }
      
      const item = {
        id: Date.now(),
        visitId: state.currentVisit.id,
        photo: state.formData.photo,
        category: document.getElementById('category')?.value || '',
        modelNumber: document.getElementById('modelNumber')?.value || '',
        color: document.getElementById('color')?.value || '',
        material: document.getElementById('material')?.value || '',
        factoryPrice: parseFloat(factoryPrice),
        moq: parseInt(document.getElementById('moq').value) || 1,
        description: document.getElementById('description').value,
        status: 'review',
        timestamp: new Date().toISOString()
      };
      
      state.items.push(item);
      saveState();
      
      if (addNext) {
        state.formData = { photo: null, factoryPrice: '', moq: '1', description: '', modelNumber: '', color: '', material: '', category: '' };
        render();
        setTimeout(() => document.getElementById('productPhoto').click(), 100);
      } else {
        state.formData = { photo: null, factoryPrice: '', moq: '1', description: '', modelNumber: '', color: '', material: '', category: '' };
        state.view = 'visitDetail';
        render();
      }
    }

    function editProduct(id) {
      const item = state.items.find(i => i.id === id);
      if (item) {
        state.currentEditItem = item;
        state.formData = {
          photo: item.photo,
          factoryPrice: item.factoryPrice.toString(),
          moq: item.moq.toString(),
          description: item.description,
          category: item.category || '',
          modelNumber: item.modelNumber || '',
          color: item.color || '',
          material: item.material || ''
        };
        state.view = 'editProduct';
        render();
      }
    }

    function updateProduct() {
      const factoryPrice = document.getElementById('factoryPrice').value;
      
      if (!state.formData.photo || !factoryPrice) {
        return alert('Please fill in photo and factory price');
      }
      
      state.currentEditItem.photo = state.formData.photo;
      state.currentEditItem.category = document.getElementById('category')?.value || '';
      state.currentEditItem.modelNumber = document.getElementById('modelNumber')?.value || '';
      state.currentEditItem.color = document.getElementById('color')?.value || '';
      state.currentEditItem.material = document.getElementById('material')?.value || '';
      state.currentEditItem.factoryPrice = parseFloat(factoryPrice);
      state.currentEditItem.moq = parseInt(document.getElementById('moq').value) || 1;
      state.currentEditItem.description = document.getElementById('description').value;
      
      saveState();
      state.formData = { photo: null, factoryPrice: '', moq: '1', description: '', modelNumber: '', color: '', material: '', category: '' };
      state.currentEditItem = null;
      state.view = 'visitDetail';
      render();
    }

    function toggleShortlist(id) {
      const item = state.items.find(i => i.id === id);
      item.status = item.status === 'shortlist' ? 'review' : 'shortlist';
      saveState();
      render();
    }

    function shortlistAll() {
      if (confirm('Shortlist all items from this supplier?')) {
        state.items.forEach(item => {
          if (item.visitId === state.currentVisit.id) {
            item.status = 'shortlist';
          }
        });
        saveState();
        render();
      }
    }

    function deleteItem(id) {
      if (confirm('Delete this item?')) {
        state.items = state.items.filter(i => i.id !== id);
        saveState();
        render();
      }
    }

    function toggleNegotiation() {
      document.getElementById('negotiationPhoto').click();
    }

    function removeNegotiation() {
      state.negotiationPhoto = null;
      state.negotiationNotes = '';
      render();
    }

    function reviewShortlist() {
      state.view = 'reviewPO';
      render();
    }

    function clearOldData() {
      if (confirm('Archive items older than 30 days?')) {
        const cutoff = new Date();
        cutoff.setDate(cutoff.getDate() - 30);
        state.visits = state.visits.filter(v => new Date(v.timestamp) > cutoff);
        const validIds = new Set(state.visits.map(v => v.id));
        state.items = state.items.filter(i => validIds.has(i.visitId));
        saveState();
        render();
        alert('Old data archived!');
      }
    }

    function updateSettings() {
      state.settings.defaultAgentCommission = parseFloat(document.getElementById('commissionInput').value) || 5;
      state.settings.exchangeRate = parseFloat(document.getElementById('exchangeRate').value) || 4.8;
      state.settings.agentName = document.getElementById('agentName').value;
      state.settings.agentEmail = document.getElementById('agentEmail').value;
      state.settings.agentWechat = document.getElementById('agentWechat').value;
      state.settings.agentPhone = document.getElementById('agentPhone').value;
      saveState();
      render();
    }

    function addCategory() {
      const newCat = document.getElementById('newCategory').value.trim();
      if (newCat && !state.settings.categories.includes(newCat)) {
        state.settings.categories.push(newCat);
        state.settings.categories.sort();
        saveState();
        document.getElementById('newCategory').value = '';
        render();
      }
    }

    function removeCategory(index) {
      if (confirm('Remove this category? Items will keep their category tag.')) {
        state.settings.categories.splice(index, 1);
        saveState();
        render();
      }
    }

    function changeView(view) {
      state.view = view;
      render();
    }

    function changeHomeTab(tab) {
      state.homeTab = tab;
      render();
    }

    function openVisit(id) {
      state.currentVisit = state.visits.find(v => v.id === id);
      state.view = 'visitDetail';
      render();
    }

    function filterByCategory(category) {
      state.selectedCategory = category;
      render();
    }

    function exportForWeChat() {
      const shortlisted = state.items.filter(i => i.visitId === state.currentVisit.id && i.status === 'shortlist');
      
      if (shortlisted.length === 0) {
        alert('No items shortlisted. Please shortlist items first.');
        return;
      }
      
      const totalRMB = shortlisted.reduce((sum, i) => sum + (i.factoryPrice * (i.moq || 1)), 0);
      const commission = state.currentVisit?.agentCommission || state.settings.defaultAgentCommission;
      const commissionAmount = totalRMB * (commission / 100);
      const grandTotal = totalRMB + commissionAmount;
      
      const poText = `📋 PURCHASE ORDER REQUEST

━━━━━━━━━━━━━━━━━━━━━━
🏢 SUPPLIER
━━━━━━━━━━━━━━━━━━━━━━
${state.currentVisit.name}
${state.currentVisit.tradeFair ? '🎪 ' + state.currentVisit.tradeFair : ''}
📍 Booth: ${state.currentVisit.boothNumber}
👤 ${state.currentVisit.contact || 'N/A'}
☎️ ${state.currentVisit.phone || 'N/A'}
📱 ${state.currentVisit.wechat || 'N/A'}
📧 ${state.currentVisit.email || 'N/A'}
🏭 ${state.currentVisit.address || 'N/A'}

━━━━━━━━━━━━━━━━━━━━━━
🛍️ ORDER (${shortlisted.length} items)
━━━━━━━━━━━━━━━━━━━━━━
${shortlisted.map((item, idx) => {
  const total = item.factoryPrice * (item.moq || 1);
  let itemText = `${idx + 1}. ¥${item.factoryPrice.toFixed(2)} × ${item.moq} = ¥${total.toFixed(2)} (A\\$${convertToAUD(total)})`;
  if (item.modelNumber) itemText += `\\n   🏷️ Model: ${item.modelNumber}`;
  if (item.color) itemText += `\\n   🎨 Color: ${item.color}`;
  if (item.material) itemText += `\\n   📦 Material: ${item.material}`;
  if (item.description) itemText += `\\n   📝 ${item.description}`;
  return itemText;
}).join('\\n\\n')}

━━━━━━━━━━━━━━━━━━━━━━
💰 SUMMARY
━━━━━━━━━━━━━━━━━━━━━━
Subtotal: ¥${totalRMB.toFixed(2)}
Commission (${commission}%): ¥${commissionAmount.toFixed(2)}
──────────────────────
TOTAL: ¥${grandTotal.toFixed(2)}
       A\\$${convertToAUD(grandTotal)}

━━━━━━━━━━━━━━━━━━━━━━
👤 AGENT
━━━━━━━━━━━━━━━━━━━━━━
${state.settings.agentName}
📧 ${state.settings.agentEmail}
📱 ${state.settings.agentWechat}
☎️ ${state.settings.agentPhone}

━━━━━━━━━━━━━━━━━━━━━━
Exchange: ¥${state.settings.exchangeRate} = A\\$1
Generated: ${new Date().toLocaleString()}

📸 ${shortlisted.length} product photos will be sent separately`;

      const exportPackage = {
        poText: poText,
        images: shortlisted.map((item, idx) => ({
          id: idx + 1,
          photo: item.photo,
          modelNumber: item.modelNumber,
          price: item.factoryPrice,
          moq: item.moq,
          color: item.color,
          material: item.material,
          description: item.description
        })),
        negotiation: state.negotiationPhoto ? {
          photo: state.negotiationPhoto,
          notes: state.negotiationNotes
        } : null,
        supplier: state.currentVisit,
        date: new Date().toISOString()
      };

      localStorage.setItem('wechat_export', JSON.stringify(exportPackage));
      state.view = 'wechatExport';
      render();
    }

    function copyPOText() {
      const exportData = JSON.parse(localStorage.getItem('wechat_export'));
      if (!exportData) return;
      
      navigator.clipboard.writeText(exportData.poText).then(() => {
        alert('✓ PO text copied to clipboard!\\n\\nNow:\\n1. Open WeChat\\n2. Paste the text\\n3. Return here to get photos');
      }).catch(() => {
        const textarea = document.createElement('textarea');
        textarea.value = exportData.poText;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        alert('✓ PO text copied!\\n\\nPaste into WeChat, then return for photos.');
      });
    }

    function downloadImage(index) {
      const exportData = JSON.parse(localStorage.getItem('wechat_export'));
      if (!exportData || !exportData.images[index]) return;
      
      const img = exportData.images[index];
      const link = document.createElement('a');
      link.href = img.photo;
      link.download = `product-${index + 1}-${Date.now()}.jpg`;
      link.click();
      
      alert(`Photo ${index + 1} downloaded!\\n\\nLong-press the downloaded image and select "Share to WeChat"`);
    }

    function downloadAllImages() {
      const exportData = JSON.parse(localStorage.getItem('wechat_export'));
      if (!exportData) return;
      
      exportData.images.forEach((img, idx) => {
        setTimeout(() => {
          const link = document.createElement('a');
          link.href = img.photo;
          link.download = `product-${idx + 1}-${Date.now()}.jpg`;
          link.click();
        }, idx * 500);
      });
      
      alert(`Downloading ${exportData.images.length} photos...\\n\\nAfter download:\\n1. Go to Downloads folder\\n2. Select all photos\\n3. Share to WeChat`);
    }

    function downloadNegotiation() {
      const exportData = JSON.parse(localStorage.getItem('wechat_export'));
      if (!exportData || !exportData.negotiation) return;
      
      const link = document.createElement('a');
      link.href = exportData.negotiation.photo;
      link.download = `negotiation-${Date.now()}.jpg`;
      link.click();
      
      alert('Negotiation photo downloaded!\\n\\nShare to WeChat with notes:\\n' + exportData.negotiation.notes);
    }

    function finishWeChatExport() {
      if (confirm('Mark items as sent to agent?')) {
        state.items.forEach(item => {
          if (item.visitId === state.currentVisit.id && item.status === 'shortlist') {
            item.status = 'sent';
            item.sentDate = new Date().toISOString();
          }
        });
        saveState();
        localStorage.removeItem('wechat_export');
        state.negotiationPhoto = null;
        state.negotiationNotes = '';
      }
      state.view = 'visitDetail';
      render();
    }

    function sendPO() {
      const shortlisted = state.items.filter(i => i.visitId === state.currentVisit.id && i.status === 'shortlist');
      
      if (shortlisted.length === 0) {
        alert('No items shortlisted. Please shortlist items first.');
        return;
      }
      
      if (!state.settings.agentEmail) {
        alert('Please set agent email in Settings first.');
        return;
      }
      
      const totalRMB = shortlisted.reduce((sum, i) => sum + (i.factoryPrice * (i.moq || 1)), 0);
      const commission = state.currentVisit.agentCommission || state.settings.defaultAgentCommission;
      const commissionAmount = totalRMB * (commission / 100);
      const grandTotal = totalRMB + commissionAmount;
      
      const negotiationSection = state.negotiationPhoto ? `

══════════════════════════════════════
PRICE NEGOTIATION REQUEST
══════════════════════════════════════
A photo of price negotiation has been attached.
${document.getElementById('negotiationNotes')?.value || 'Please review and provide best pricing.'}

Note: Photo cannot be embedded in email. Please check attached files or see below for product details.
` : '';
      
      const itemsList = shortlisted.map((item, index) => {
        const itemTotal = item.factoryPrice * (item.moq || 1);
        let itemText = `${index + 1}. Price: ¥${item.factoryPrice.toFixed(2)} × MOQ: ${item.moq} = ¥${itemTotal.toFixed(2)} (A\\$${convertToAUD(itemTotal)})`;
        if (item.modelNumber) itemText += `\\n   Model/Code: ${item.modelNumber}`;
        if (item.color) itemText += `\\n   Color: ${item.color}`;
        if (item.material) itemText += `\\n   Material: ${item.material}`;
        if (item.description) itemText += `\\n   Notes: ${item.description}`;
        itemText += `\\n   Photo: [Product image ${index + 1} - please see attachments]`;
        return itemText;
      }).join('\\n\\n');
      
      const body = `PURCHASE ORDER REQUEST

══════════════════════════════════════
SUPPLIER INFORMATION
══════════════════════════════════════
Company: ${state.currentVisit.name}
${state.currentVisit.tradeFair ? 'Trade Fair: ' + state.currentVisit.tradeFair : ''}
Booth Number: ${state.currentVisit.boothNumber}
Contact Person: ${state.currentVisit.contact || 'N/A'}
Phone: ${state.currentVisit.phone || 'N/A'}
WeChat: ${state.currentVisit.wechat || 'N/A'}
Email: ${state.currentVisit.email || 'N/A'}
Address: ${state.currentVisit.address || 'N/A'}

══════════════════════════════════════
ORDER DETAILS
══════════════════════════════════════
Total Items: ${shortlisted.length}

IMPORTANT: ${shortlisted.length} product photos are referenced below.
Please download product images separately as they cannot be embedded in this email.

${itemsList}
${negotiationSection}

══════════════════════════════════════
FINANCIAL SUMMARY
══════════════════════════════════════
Subtotal (Products):        ¥${totalRMB.toFixed(2)} (A\\$${convertToAUD(totalRMB)})
Agent Commission (${commission}%):    ¥${commissionAmount.toFixed(2)} (A\\$${convertToAUD(commissionAmount)})
────────────────────────────────────
GRAND TOTAL:                ¥${grandTotal.toFixed(2)} (A\\$${convertToAUD(grandTotal)})

══════════════════════════════════════
AGENT INFORMATION
══════════════════════════════════════
Agent: ${state.settings.agentName}
Email: ${state.settings.agentEmail}
WeChat: ${state.settings.agentWechat}
Phone: ${state.settings.agentPhone}

══════════════════════════════════════

Exchange Rate: ¥${state.settings.exchangeRate} = A\\$1.00
Generated: ${new Date().toLocaleString()}

ACTION REQUIRED:
1. Review product photos (${shortlisted.length} images)
2. ${state.negotiationPhoto ? 'Review negotiation request photo' : 'Confirm pricing'}
3. Provide delivery timeline
4. Send proforma invoice

NEXT STEPS TO ATTACH PHOTOS:
Unfortunately, email body cannot contain images. Please:
- Save product photos from the app
- Attach to a follow-up email, OR
- Share via WeChat: ${state.settings.agentWechat}

Product photos can be exported from the app using the Export function.`;
      
      const mailto = `mailto:${state.settings.agentEmail}?cc=${state.currentVisit.email || ''}&subject=PO Request - ${state.currentVisit.name} - ${shortlisted.length} Items&body=${encodeURIComponent(body)}`;
      
      alert(`⚠️ EMAIL PHOTO LIMITATION

Email will open with all details, but PHOTOS CANNOT be embedded in email body.

Please manually:
1. Export product data (with photos)
2. Send photos via WeChat to agent
3. Or attach photos to a follow-up email

Click OK to continue to email.`);
      
      window.location.href = mailto;
      
      if (confirm('Email opened. Mark this order as sent?')) {
        shortlisted.forEach(item => {
          item.status = 'sent';
          item.sentDate = new Date().toISOString();
        });
        saveState();
        state.negotiationPhoto = null;
        state.negotiationNotes = '';
        state.view = 'visitDetail';
        render();
      }
    }

    // Render functions for tabs
    function renderRecentTab() {
      const recentVisits = state.visits.slice().reverse().slice(0, 10);
      return `
        <div class="bg-white rounded-lg shadow p-4">
          <div class="flex justify-between items-center mb-3">
            <h2 class="text-lg font-bold">Recent Visits</h2>
            <button onclick="clearOldData()" class="text-sm text-blue-600">🧹 Cleanup</button>
          </div>
          ${recentVisits.length === 0 ? 
            '<p class="text-gray-500 text-center py-8">No suppliers yet!</p>' :
            `<div class="space-y-2">
              ${recentVisits.map(visit => {
                const items = state.items.filter(i => i.visitId === visit.id);
                const shortlisted = items.filter(i => i.status === 'shortlist').length;
                return `
                  <div onclick="openVisit(${visit.id})" class="border rounded-lg p-3 cursor-pointer active:bg-gray-50">
                    <div class="flex justify-between">
                      <div>
