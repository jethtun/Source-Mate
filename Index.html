<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2563eb">
  <title>Sourcing Mate Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  
  <script>
    // Simple vanilla JS implementation
    let state = {
      visits: JSON.parse(localStorage.getItem('visits') || '[]'),
      items: JSON.parse(localStorage.getItem('items') || '[]'),
      settings: JSON.parse(localStorage.getItem('settings') || '{"defaultAgentCommission":15}'),
      currentVisit: null,
      view: 'home',
      formData: { photo: null, wholesalePrice: '', retailPrice: '', moq: '', description: '' },
      supplierForm: { name: '', wechat: '', email: '', address: '', cardImage: null, agentCommission: '' }
    };

    function saveState() {
      localStorage.setItem('visits', JSON.stringify(state.visits));
      localStorage.setItem('items', JSON.stringify(state.items));
      localStorage.setItem('settings', JSON.stringify(state.settings));
    }

    function render() {
      const app = document.getElementById('app');
      
      if (state.view === 'home') {
        app.innerHTML = `
          <div class="min-h-screen bg-gray-100">
            <div class="bg-blue-600 text-white p-4">
              <div class="flex justify-between items-center">
                <div>
                  <h1 class="text-2xl font-bold">Sourcing Mate Pro</h1>
                  <p class="text-sm opacity-90">Offline • ${getStorageSize()}KB</p>
                </div>
                <button onclick="changeView('settings')" class="p-2 bg-blue-700 rounded">⚙️</button>
              </div>
            </div>
            <div class="p-4">
              <button onclick="changeView('newSupplier')" class="w-full bg-blue-600 text-white p-4 rounded-lg mb-4 text-lg font-semibold">
                ➕ New Supplier
              </button>
              <div class="grid grid-cols-3 gap-2 mb-4">
                <button onclick="exportData()" class="bg-white p-3 rounded-lg text-sm border">📤 Export</button>
                <button onclick="document.getElementById('importFile').click()" class="bg-white p-3 rounded-lg text-sm border">📥 Import</button>
                <button onclick="clearOldData()" class="bg-white p-3 rounded-lg text-sm border">🧹 Clean</button>
              </div>
              <input type="file" id="importFile" accept=".json" onchange="importData(event)" class="hidden">
              
              <div class="bg-white rounded-lg shadow p-4">
                <div class="flex justify-between items-center mb-3">
                  <h2 class="text-lg font-bold">Recent Visits</h2>
                  <span class="text-sm text-gray-500">${state.visits.length} suppliers</span>
                </div>
                ${state.visits.length === 0 ? 
                  '<p class="text-gray-500 text-center py-8">No suppliers yet!</p>' :
                  `<div class="space-y-2">
                    ${state.visits.slice().reverse().map(visit => {
                      const items = state.items.filter(i => i.visitId === visit.id);
                      const shortlisted = items.filter(i => i.status === 'shortlist').length;
                      return `
                        <div onclick="openVisit(${visit.id})" class="border rounded-lg p-3 cursor-pointer active:bg-gray-50">
                          <div class="flex justify-between">
                            <div>
                              <h3 class="font-semibold">${visit.name}</h3>
                              <p class="text-sm text-gray-600">${visit.wechat || ''}</p>
                            </div>
                            <div class="text-right">
                              <div class="text-sm text-gray-500">${items.length} items</div>
                              ${shortlisted > 0 ? `<div class="text-sm text-yellow-600">⭐ ${shortlisted}</div>` : ''}
                            </div>
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>`
                }
              </div>
            </div>
          </div>
        `;
      }
      
      else if (state.view === 'settings') {
        app.innerHTML = `
          <div class="min-h-screen bg-gray-100">
            <div class="bg-blue-600 text-white p-4 flex items-center gap-3">
              <button onclick="changeView('home')" class="text-2xl">←</button>
              <h1 class="text-xl font-bold">Settings</h1>
            </div>
            <div class="p-4">
              <div class="bg-white rounded-lg shadow p-4 space-y-4">
                <div>
                  <label class="block text-sm font-medium mb-2">Default Agent Commission %</label>
                  <input type="number" id="commissionInput" value="${state.settings.defaultAgentCommission}" 
                    onchange="updateCommission(this.value)" class="w-full border rounded-lg p-3 text-lg">
                </div>
                <div class="pt-4 border-t">
                  <h3 class="font-semibold mb-2">Storage Info</h3>
                  <p class="text-sm">Total: ${getStorageSize()}KB</p>
                  <p class="text-sm">Suppliers: ${state.visits.length}</p>
                  <p class="text-sm">Products: ${state.items.length}</p>
                </div>
              </div>
            </div>
          </div>
        `;
      }
      
      else if (state.view === 'newSupplier') {
        app.innerHTML = `
          <div class="min-h-screen bg-gray-100">
            <div class="bg-blue-600 text-white p-4 flex items-center gap-3">
              <button onclick="changeView('home')" class="text-2xl">←</button>
              <h1 class="text-xl font-bold">New Supplier</h1>
            </div>
            <div class="p-4">
              <div class="bg-white rounded-lg shadow p-4 space-y-4">
                <div>
                  <button onclick="document.getElementById('cardPhoto').click()" 
                    class="w-full border-2 border-dashed rounded-lg p-8">
                    ${state.supplierForm.cardImage ? 
                      `<img src="${state.supplierForm.cardImage}" class="w-full h-32 object-cover rounded">` :
                      '<div class="text-center"><div class="text-4xl">📇</div><p>Scan Business Card</p></div>'
                    }
                  </button>
                  <input type="file" id="cardPhoto" accept="image/*" capture="environment" 
                    onchange="handleCardPhoto(event)" class="hidden">
                </div>
                <input type="text" id="supplierName" placeholder="Supplier Name *" 
                  class="w-full border rounded-lg p-3 text-lg">
                <input type="text" id="supplierWechat" placeholder="WeChat ID" 
                  class="w-full border rounded-lg p-3 text-lg">
                <input type="email" id="supplierEmail" placeholder="Email" 
                  class="w-full border rounded-lg p-3 text-lg">
                <input type="text" id="supplierAddress" placeholder="Address" 
                  class="w-full border rounded-lg p-3 text-lg">
                <input type="number" id="supplierCommission" placeholder="Commission % (default: ${state.settings.defaultAgentCommission}%)" 
                  class="w-full border rounded-lg p-3 text-lg">
                <button onclick="saveSupplier()" class="w-full bg-blue-600 text-white p-4 rounded-lg font-semibold">
                  Save Supplier
                </button>
              </div>
            </div>
          </div>
        `;
      }
      
      else if (state.view === 'addProduct') {
        const margin = calculateMargin(state.formData.wholesalePrice, state.formData.retailPrice);
        app.innerHTML = `
          <div class="min-h-screen bg-gray-100">
            <div class="bg-blue-600 text-white p-4 flex items-center gap-3">
              <button onclick="changeView('visitDetail')" class="text-2xl">←</button>
              <h1 class="text-xl font-bold">Add Product</h1>
            </div>
            <div class="p-4">
              <div class="bg-white rounded-lg shadow p-4 space-y-4">
                <div>
                  <button onclick="document.getElementById('productPhoto').click()" 
                    class="w-full border-2 border-dashed rounded-lg p-8">
                    ${state.formData.photo ? 
                      `<img src="${state.formData.photo}" class="w-full h-48 object-cover rounded">` :
                      '<div class="text-center"><div class="text-5xl">📷</div><p class="font-semibold">Take Photo</p></div>'
                    }
                  </button>
                  <input type="file" id="productPhoto" accept="image/*" capture="environment" 
                    onchange="handleProductPhoto(event)" class="hidden">
                </div>
                <div class="grid grid-cols-2 gap-4">
                  <input type="number" step="0.01" id="wholesalePrice" placeholder="Factory ¥" 
                    oninput="updatePrices()" class="border rounded-lg p-3 text-lg" value="${state.formData.wholesalePrice}">
                  <input type="number" step="0.01" id="retailPrice" placeholder="Retail A$" 
                    oninput="updatePrices()" class="border rounded-lg p-3 text-lg" value="${state.formData.retailPrice}">
                </div>
                ${state.formData.wholesalePrice && state.formData.retailPrice ? 
                  `<div class="bg-green-50 border border-green-200 rounded-lg p-4">
                    <div class="text-sm">Margin</div>
                    <div class="text-3xl font-bold text-green-600">${margin}%</div>
                  </div>` : ''
                }
                <input type="text" id="moq" placeholder="MOQ" class="w-full border rounded-lg p-3" value="${state.formData.moq}">
                <textarea id="description" placeholder="Notes" rows="2" class="w-full border rounded-lg p-3">${state.formData.description}</textarea>
                <div class="flex gap-2">
                  <button onclick="saveProduct(true)" class="flex-1 bg-green-600 text-white p-4 rounded-lg font-semibold">
                    Save & Next
                  </button>
                  <button onclick="saveProduct(false)" class="flex-1 bg-blue-600 text-white p-4 rounded-lg font-semibold">
                    Finish
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }
      
      else if (state.view === 'visitDetail') {
        const items = state.items.filter(i => i.visitId === state.currentVisit.id);
        const shortlisted = items.filter(i => i.status === 'shortlist');
        app.innerHTML = `
          <div class="min-h-screen bg-gray-100">
            <div class="bg-blue-600 text-white p-4">
              <button onclick="changeView('home')" class="text-2xl mb-2">←</button>
              <h1 class="text-xl font-bold">${state.currentVisit.name}</h1>
              <p class="text-sm opacity-90">${state.currentVisit.wechat || ''}</p>
            </div>
            <div class="p-4">
              <button onclick="changeView('addProduct')" class="w-full bg-green-600 text-white p-4 rounded-lg mb-4 font-semibold">
                ➕ Add Product
              </button>
              ${shortlisted.length > 0 ? `
                <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-3 mb-4">
                  <div class="flex justify-between items-center">
                    <div class="font-semibold text-yellow-800">${shortlisted.length} Shortlisted</div>
                    <button onclick="sendEmail()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm">
                      ✉️ Email
                    </button>
                  </div>
                </div>
              ` : ''}
              <div class="bg-white rounded-lg shadow p-4">
                <h2 class="font-bold mb-3">Products (${items.length})</h2>
                ${items.length === 0 ? 
                  '<p class="text-gray-500 text-center py-8">No products yet!</p>' :
                  `<div class="space-y-3">
                    ${items.slice().reverse().map(item => `
                      <div class="border rounded-lg p-3">
                        <div class="flex gap-3">
                          <img src="${item.photo}" class="w-24 h-24 object-cover rounded">
                          <div class="flex-1">
                            <div class="flex justify-between">
                              <div>
                                <div class="font-semibold">¥${item.wholesalePrice.toFixed(2)}</div>
                                <div class="text-sm text-gray-600">A$${item.retailPrice.toFixed(2)}</div>
                              </div>
                              <div class="flex gap-2">
                                <button onclick="toggleShortlist(${item.id})" 
                                  class="p-2 rounded text-2xl ${item.status === 'shortlist' ? 'bg-yellow-100' : 'bg-gray-100'}">
                                  ${item.status === 'shortlist' ? '⭐' : '☆'}
                                </button>
                                <button onclick="deleteItem(${item.id})" class="p-2 rounded bg-gray-100">🗑️</button>
                              </div>
                            </div>
                            ${item.moq ? `<div class="text-xs text-gray-500 mt-1">MOQ: ${item.moq}</div>` : ''}
                            ${item.description ? `<div class="text-sm mt-1">${item.description}</div>` : ''}
                          </div>
                        </div>
                      </div>
                    `).join('')}
                  </div>`
                }
              </div>
            </div>
          </div>
        `;
      }
    }

    function changeView(view) {
      state.view = view;
      render();
    }

    function openVisit(id) {
      state.currentVisit = state.visits.find(v => v.id === id);
      state.view = 'visitDetail';
      render();
    }

    function getStorageSize() {
      const size = (new Blob([JSON.stringify(state.visits)]).size + 
                   new Blob([JSON.stringify(state.items)]).size) / 1024;
      return size.toFixed(1);
    }

    function compressImage(file, maxWidth, quality) {
      return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > maxWidth) {
              h = h * maxWidth / w;
              w = maxWidth;
            }
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function handleCardPhoto(e) {
      const file = e.target.files[0];
      if (file) {
        state.supplierForm.cardImage = await compressImage(file, 1200, 0.8);
        render();
      }
    }

    async function handleProductPhoto(e) {
      const file = e.target.files[0];
      if (file) {
        state.formData.photo = await compressImage(file, 800, 0.7);
        render();
      }
    }

    function saveSupplier() {
      const name = document.getElementById('supplierName').value;
      if (!name) return alert('Please enter supplier name');
      
      const visit = {
        id: Date.now(),
        name: name,
        wechat: document.getElementById('supplierWechat').value,
        email: document.getElementById('supplierEmail').value,
        address: document.getElementById('supplierAddress').value,
        cardImage: state.supplierForm.cardImage,
        agentCommission: parseFloat(document.getElementById('supplierCommission').value) || state.settings.defaultAgentCommission,
        timestamp: new Date().toISOString()
      };
      
      state.visits.push(visit);
      state.currentVisit = visit;
      state.supplierForm = { name: '', wechat: '', email: '', address: '', cardImage: null, agentCommission: '' };
      saveState();
      state.view = 'visitDetail';
      render();
    }

    function calculateMargin(wholesale, retail) {
      if (!wholesale || !retail) return 0;
      const commission = state.currentVisit.agentCommission || state.settings.defaultAgentCommission;
      const landed = parseFloat(wholesale) * (1 + commission / 100);
      return (((parseFloat(retail) - landed) / parseFloat(retail)) * 100).toFixed(1);
    }

    function updatePrices() {
      state.formData.wholesalePrice = document.getElementById('wholesalePrice').value;
      state.formData.retailPrice = document.getElementById('retailPrice').value;
      render();
    }

    function saveProduct(addNext) {
      const wholesale = document.getElementById('wholesalePrice').value;
      const retail = document.getElementById('retailPrice').value;
      
      if (!state.formData.photo || !wholesale || !retail) {
        return alert('Please fill in photo and prices');
      }
      
      const item = {
        id: Date.now(),
        visitId: state.currentVisit.id,
        photo: state.formData.photo,
        wholesalePrice: parseFloat(wholesale),
        retailPrice: parseFloat(retail),
        moq: document.getElementById('moq').value,
        description: document.getElementById('description').value,
        status: 'review',
        timestamp: new Date().toISOString()
      };
      
      state.items.push(item);
      saveState();
      
      if (addNext) {
        state.formData = { photo: null, wholesalePrice: '', retailPrice: '', moq: '', description: '' };
        render();
        setTimeout(() => document.getElementById('productPhoto').click(), 100);
      } else {
        state.formData = { photo: null, wholesalePrice: '', retailPrice: '', moq: '', description: '' };
        state.view = 'visitDetail';
        render();
      }
    }

    function toggleShortlist(id) {
      const item = state.items.find(i => i.id === id);
      item.status = item.status === 'shortlist' ? 'review' : 'shortlist';
      saveState();
      render();
    }

    function deleteItem(id) {
      if (confirm('Delete this item?')) {
        state.items = state.items.filter(i => i.id !== id);
        saveState();
        render();
      }
    }

    function sendEmail() {
      const items = state.items.filter(i => i.visitId === state.currentVisit.id && i.status === 'shortlist');
      const total = items.reduce((sum, i) => sum + i.wholesalePrice, 0);
      const body = `Purchase Order\n\nSupplier: ${state.currentVisit.name}\nItems: ${items.length}\nTotal: ¥${total.toFixed(2)}\n\nAgent commission: ${state.currentVisit.agentCommission}%`;
      window.location.href = `mailto:${state.currentVisit.email}?subject=Purchase Order - ${state.currentVisit.name}&body=${encodeURIComponent(body)}`;
    }

    function exportData() {
      const data = { visits: state.visits, items: state.items, exportDate: new Date().toISOString() };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `sourcing-backup-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            const data = JSON.parse(ev.target.result);
            if (data.visits && data.items) {
              state.visits = data.visits;
              state.items = data.items;
              saveState();
              render();
              alert('Data imported!');
            }
          } catch (err) {
            alert('Error importing data');
          }
        };
        reader.readAsText(file);
      }
    }

    function clearOldData() {
      if (confirm('Archive items older than 30 days?')) {
        const cutoff = new Date();
        cutoff.setDate(cutoff.getDate() - 30);
        state.visits = state.visits.filter(v => new Date(v.timestamp) > cutoff);
        const validIds = new Set(state.visits.map(v => v.id));
        state.items = state.items.filter(i => validIds.has(i.visitId));
        saveState();
        render();
        alert('Old data archived!');
      }
    }

    function updateCommission(value) {
      state.settings.defaultAgentCommission = parseFloat(value) || 15;
      saveState();
    }

    // Initial render
    render();
  </script>
</body>
</html>
